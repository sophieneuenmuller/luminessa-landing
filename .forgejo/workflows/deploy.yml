name: Build and Deploy Landing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: docker
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to server
        run: |
          apk add --no-cache rsync openssh
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -p 222 -i ~/.ssh/id_ed25519" \
          dist/ blog-deploy@git.luminessa.net:/var/www/luminessa-landing/
